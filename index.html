<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3EADB">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Спасибо за жизнь.">

<title>С днем рождения, пап</title>

<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="apple-touch-icon" href="assets/images/favicon.png">
<link rel="stylesheet" href="assets/css/style.css">

<meta property="og:type" content="website">
<meta property="og:title" content="С днем рождения, пап ❤️">
<meta property="og:description" content="Спасибо за жизнь.">
<meta property="og:image" content="assets/images/photo-01.jpg">
<meta name="twitter:card" content="summary_large_image">

<script>document.documentElement.className = "js";</script>
</head>
<body>

<div class="layer">

  <!-- 1. ОБЛОЖКА -->
  <section class="cover">
    <div class="mount reveal" style="--d:.1s">
      <div class="frame">
        <span class="tape" aria-hidden="true"></span>
        <img src="assets/images/photo-01.jpg" width="917" height="1400" alt="Папа держит меня на руках" decoding="async">
        <span class="gloss" aria-hidden="true"></span>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      </div>
    </div>
    <div class="titles">
      <h1 class="reveal" style="--d:.5s">С днем рождения, пап <span class="heart">❤️</span></h1>
      <div class="rule reveal" style="--d:.75s"></div>
      <p class="lede reveal" style="--d:.95s">Спасибо за жизнь.</p>
      <button class="sound reveal" id="snd" type="button" style="--d:1.15s" aria-label="Включить тихую музыку">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 9.5h3.2L12.5 6v12L8.2 14.5H5z"></path>
          <path class="wave" d="M15.6 9.6a3.6 3.6 0 0 1 0 4.8"></path>
          <path class="wave" d="M18.1 7.4a7 7 0 0 1 0 9.2"></path>
        </svg>
      </button>
    </div>
  </section>

  <!-- 2. ДЕТСТВО -->
  <section class="sheet">
    <span class="gutter" aria-hidden="true"></span>
    <div class="spread">
      <div class="mount card a reveal" style="--d:0s">
        <div class="frame">
          <span class="tape corner-left" aria-hidden="true"></span>
          <img src="assets/images/photo-02.jpg" width="1400" height="927" alt="Папа и я дома" decoding="async">
          <span class="gloss" aria-hidden="true"></span>
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        </div>
      </div>
      <div class="mount card b reveal" style="--d:.2s">
        <div class="frame">
          <img src="assets/images/photo-03.jpg" width="1400" height="1168" alt="Папа со мной на руках" decoding="async">
          <span class="gloss" aria-hidden="true"></span>
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. ГЛАВНЫЙ ТЕКСТ -->
  <section class="quiet">
    <div class="rule reveal" style="--d:0s;margin-top:0"></div>
    <p class="quote reveal" style="--d:.2s">Спасибо за жизнь,<br><em>я вас люблю,</em><br>хоть и так редко<br>говорю об этом.</p>
    <div class="rule reveal" style="--d:.45s;margin-top:0"></div>
  </section>

  <!-- 4. ФОТОКОЛЛАЖ -->
  <section class="sheet">
    <span class="gutter" aria-hidden="true"></span>
    <div class="spread">
      <div class="mount card c reveal" style="--d:0s">
        <div class="frame">
          <img src="assets/images/photo-04.jpg" width="909" height="1400" alt="Папа держит меня на руках дома" decoding="async">
          <span class="gloss" aria-hidden="true"></span>
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        </div>
      </div>
      <div class="mount card d reveal" style="--d:.2s">
        <div class="frame">
          <span class="tape corner-right" aria-hidden="true"></span>
          <img src="assets/images/photo-05.jpg" width="1034" height="1400" alt="Папа и я" decoding="async">
          <span class="gloss" aria-hidden="true"></span>
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        </div>
      </div>
    </div>
  </section>

  <!-- 5. ФИНАЛ -->
  <section class="final">
    <div class="mount reveal" style="--d:0s">
      <div class="frame">
        <img src="assets/images/photo-01.jpg" width="917" height="1400" alt="Папа держит меня на руках" decoding="async">
        <span class="gloss" aria-hidden="true"></span>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      </div>
    </div>
    <div class="titles">
      <h1 class="reveal" style="--d:.2s">С днем рождения, пап <span class="heart">❤️</span></h1>
      <div class="rule reveal" style="--d:.45s"></div>
      <p class="sign reveal" style="--d:.6s">Спасибо за жизнь, я вас люблю, хоть и так редко говорю об этом.</p>
    </div>
  </section>

</div>

<audio id="mus" loop preload="none" playsinline webkit-playsinline src="assets/audio/ambient.mp3"></audio>

<script src="assets/js/main.js"></script>
</body>
</html>
